server:
  port: 8092 # 项目启动的端口
spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  application:
    name: happynode-search
  cloud:
    nacos:
      server-addr: 10.0.0.204:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        namespace: 1c1ad03a-6534-4baf-9f4d-de1d36b791db
        refresh-enabled: true
      discovery:
        namespace: 1c1ad03a-6534-4baf-9f4d-de1d36b791db
        group: default
  config:
    import:
      - nacos:happynode-search-dev?group=search
management:
  endpoints:
    web:
      exposure:
        include: refresh   # 开放 refresh 端点
logging:
  level:
    com.alibaba.cloud.nacos.configdata: debug