server:
  port: 8093 # 项目启动的端口
spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  application:
    name: happynode-comment
  cloud:
    nacos:
      server-addr: 10.0.0.204:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        namespace: 1c1ad03a-6534-4baf-9f4d-de1d36b791db
        refresh-enabled: true
      discovery:
        namespace: 1c1ad03a-6534-4baf-9f4d-de1d36b791db
        group: default
  config:
    import:
      - nacos:happynode-database?group=common
      - nacos:happynode-redis?group=common
      - nacos:happynode-rocketmq?group=common
      - nacos:happynode-comment?group=comment
management:
  endpoints:
    web:
      exposure:
        include: refresh   # 开放 refresh 端点
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.danby.happynode.comment.biz.domain.dataobject
logging:
  level:
    com.alibaba.cloud.nacos.configdata: debug
    com.danby.happynode.comment.biz.domain.mapper: debug
    com.danby.happynode.comment.biz: debug
rocketmq:
  producer:
    retry-times-when-send-async-fail: 0  # 异步发送消息失败后，重试的次数
    retry-times-when-send-sync-fail: 0 # 同步发送消息失败后，重试的次数
retry:
  max-attempts: 3 # 最大重试次数
  init-interval: 1000 # 初始延迟时间，单位 ms
  multiplier: 2 # 每次重试间隔加倍（每次乘以 2）