server:
  port: 8085 # 项目启动的端口
spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  application:
    name: happynode-distributed-id-generator
  cloud:
    nacos:
      server-addr: 10.0.0.204:8848
      username: nacos
      password: nacos
      discovery:
        namespace: 1c1ad03a-6534-4baf-9f4d-de1d36b791db
        group: default
  config:
    import:
management:
  endpoints:
    web:
      exposure:
        include: refresh   # 开放 refresh 端点
logging:
  level:
    com.alibaba.cloud.nacos.configdata: debug